x-backend-env: &backend-env
  HEXA_DATABASE_URL: "${HEXA_DATABASE_URL:-postgresql://hexa_app:devpass@postgres:5432/hexa_assistant}"
  HEXA_JWT_SECRET: "${HEXA_JWT_SECRET:-dev-only-secret-change-me-in-production-32chars}"
  HEXA_ENVIRONMENT: "${HEXA_ENVIRONMENT:-development}"
  # LLM synthesis tier (docs/LLM_INTEGRATION_PLAN.md) — values come from
  # the repo-root .env (gitignored). OFF unless explicitly enabled.
  HEXA_LLM_ENABLED: "${HEXA_LLM_ENABLED:-false}"
  # The secret's canonical name is HEXA_ANTHROPIC_API_KEY; config.py reads
  # it as llm_api_key → HEXA_LLM_API_KEY. Map here so either env name works.
  HEXA_LLM_API_KEY: "${HEXA_ANTHROPIC_API_KEY:-}${HEXA_LLM_API_KEY:-}"
  HEXA_LLM_SIMPLE_MODEL: "${HEXA_LLM_SIMPLE_MODEL:-claude-haiku-4-5}"
  HEXA_LLM_COMPLEX_MODEL: "${HEXA_LLM_COMPLEX_MODEL:-claude-sonnet-4-5}"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hexa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hexa_app
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: hexa_assistant
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "55432:5432"
    deploy:
      resources:
        limits:
          memory: 200m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexa_app -d hexa_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  hexa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hexa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      HEXA_CORS_ORIGINS: "*"
    volumes:
      - ./storage:/app/storage
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          # Dev-only cap, raised from 200m (CLAUDE.md rule 10's documented
          # default, which applies to the production infra/shared/
          # docker-compose.yml + systemd deployment). In THIS local dev
          # compose file the backend runs continuously (not socket-
          # activated) and keeps a fastembed embedding model resident for
          # query-time vector search. An upload's auto-triggered ingestion
          # subprocess (app.documents.auto_ingest.trigger_ingestion,
          # CLAUDE.md rule 5) loads a *second*, independent copy of the
          # same model to embed the new chunks -- it's a separate OS
          # process but still shares this container's cgroup memory limit.
          # Two model instances resident at once blew past 200m and the
          # kernel OOM-killed the whole container (exit 137), silently
          # dropping the ingestion subprocess before it could process the
          # uploaded file. 512m gives enough headroom for both to coexist
          # during that brief overlap. Production's socket-activated
          # deployment structurally avoids this overlap (the API process
          # isn't necessarily running when ingestion fires), which is why
          # this is a dev-compose-only change, not a change to CLAUDE.md's
          # documented production budget.
          #
          # Raised again 512m → 1g for the nomic-embed-text-v1.5-Q swap:
          # measured peak RSS of loading + running the model is ~275MB
          # (vs ~80MB for bge-small), and a scanned-PDF batch run retains
          # OCR/page-raster memory on top, so ingestion alongside even an
          # idle uvicorn (~50MB) exceeded 512m and was OOM-killed at model
          # load. Production budgets MUST be re-derived before deploying
          # nomic — see the flag in ENGINEERING_PLAN.md Phase 4.
          memory: 1g
    command: >
      uvicorn app.main:app
      --workers 1
      --host 0.0.0.0
      --port 8001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hexa_frontend
    restart: unless-stopped
    depends_on:
      - hexa-backend
    ports:
      - "80:80"

volumes:
  pg_data: