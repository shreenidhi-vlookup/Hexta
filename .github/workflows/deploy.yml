name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-timeout docker-compose

      - name: Run unit tests
        env:
          HEXA_JWT_SECRET: test-secret
          HEXA_ENVIRONMENT: test
        run: |
          cd backend
          python -m pytest tests/unit/ -v --timeout=60

      - name: Build and deploy to EC2
        if: github.ref == 'refs/heads/main'
        env:
          HEXA_JWT_SECRET: ${{ secrets.HEXA_JWT_SECRET }}
          HEXA_DATABASE_URL: ${{ secrets.HEXA_DATABASE_URL }}
