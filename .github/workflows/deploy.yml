name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Run unit tests
        env:
          HEXA_JWT_SECRET: test-secret
          HEXA_ENVIRONMENT: test
        run: |
          cd backend
          python -m pytest tests/unit/ -v --timeout=60

      - name: Build and deploy to EC2
        if: github.ref == 'refs/heads/main'
        env:
          HEXA_JWT_SECRET: ${{ secrets.HEXA_JWT_SECRET }}
          HEXA_DATABASE_URL: ${{ secrets.HEXA_DATABASE_URL }}
        run: |
          echo "Frontend build completed successfully"
          echo "Backend test suite completed successfully"
          echo "Deploy step — implement the actual EC2 deployment mechanism in a subsequent change"
