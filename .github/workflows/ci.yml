name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpass
          POSTGRES_DB: hexa_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval "10s"
          --health-timeout "5s"
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check backend/app backend/tests evaluation

      - name: Audit Python dependencies (report-only)
        # pip-audit -r requirements.txt tries to re-resolve the whole
        # dependency tree from scratch and hits a real, pre-existing
        # Pillow version conflict unrelated to this step -- auditing the
        # environment actually installed above (same set a real
        # deployment gets) avoids that and is what pip-audit is designed
        # for anyway. Non-blocking on first landing: a real run already
        # found 3 known CVEs (pdfminer-six, pytest) with no CI history to
        # judge against yet -- upgrading them is its own reviewed change,
        # not something this lint step should silently force through.
        run: |
          pip install pip-audit
          pip-audit || echo "pip-audit found issues above -- non-blocking for now, see step summary"

      - name: Install pgvector extension
        env:
          PGPASSWORD: adminpass
        run: |
          psql -h 127.0.0.1 -U admin -d hexa_assistant -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: |
          npm run lint

      - name: Audit frontend dependencies (report-only)
        # A real run already found 6 high-severity CVEs, all in Next.js
        # itself, fixable only via a breaking major-version upgrade
        # (14.x -> 16.x). That's a real, separate migration task, not
        # something a lint-tooling step should force through unreviewed.
        working-directory: frontend
        run: |
          npm audit --audit-level=high || echo "npm audit found issues above -- non-blocking for now, see step summary"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Run unit tests
        env:
          HEXA_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/hexa_assistant
          HEXA_JWT_SECRET: dev-only-secret-change-me-in-production-32chars
          HEXA_ENVIRONMENT: test
          PGPASSWORD: adminpass
        run: |
          cd backend
          python -m pytest tests/unit/ -v --timeout=60 --cov=app --cov-report=term-missing --cov-fail-under=75

      - name: Run integration tests
        env:
          HEXA_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/hexa_assistant
          HEXA_JWT_SECRET: dev-only-secret-change-me-in-production-32chars
          HEXA_ENVIRONMENT: test
          PGPASSWORD: adminpass
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd backend
          python -m pytest tests/integration/ -v --timeout=120

  # The benchmark job that used to live here ran on every PR regardless of
  # path, had no Postgres service or seeding, and so silently produced a
  # "benchmark-report" artifact with retrieval_metrics = {"status": "skipped
  # -- no DB or seeding failed"} -- a real-looking but empty result.
  # eval_on_pr.yml is the real, DB-backed benchmark/regression gate, scoped
  # to the paths that actually affect retrieval/ranking. Removed here
  # rather than duplicated.
