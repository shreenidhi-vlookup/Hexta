name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpass
          POSTGRES_DB: hexa_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval "10s"
          --health-timeout "5s"
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install pgvector extension
        env:
          PGPASSWORD: adminpass
        run: |
          psql -h 127.0.0.1 -U admin -d hexa_assistant -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Run unit tests
        env:
          HEXA_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/hexa_assistant
          HEXA_JWT_SECRET: dev-only-secret-change-me-in-production-32chars
          HEXA_ENVIRONMENT: test
          PGPASSWORD: adminpass
        run: |
          cd backend
          python -m pytest tests/unit/ -v --timeout=60

      - name: Run integration tests
        env:
          HEXA_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/hexa_assistant
          HEXA_JWT_SECRET: dev-only-secret-change-me-in-production-32chars
          HEXA_ENVIRONMENT: test
          PGPASSWORD: adminpass
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd backend
          python -m pytest tests/integration/ -v --timeout=120

  # The benchmark job that used to live here ran on every PR regardless of
  # path, had no Postgres service or seeding, and so silently produced a
  # "benchmark-report" artifact with retrieval_metrics = {"status": "skipped
  # -- no DB or seeding failed"} -- a real-looking but empty result.
  # eval_on_pr.yml is the real, DB-backed benchmark/regression gate, scoped
  # to the paths that actually affect retrieval/ranking. Removed here
  # rather than duplicated.
