# One server block per project. Add a new file here for each additional
# project — do not add more nginx containers.
#
# This proxies to 127.0.0.1:8001, which is owned by a systemd SOCKET
# unit on the host (see infra/systemd/hexa-backend.socket). The
# app process behind it only starts on the first real connection and
# is stopped again after an idle period by the watcher timer — this
# nginx config doesn't need to know that; it just proxies as normal.

server {
    listen 80;
    server_name hexa.yourdomain.com;   # replace with real subdomain

    # Redirect all plain-HTTP traffic to TLS. certbot (certbot certonly
    # --webroot) or any other ACME client can provision certificates for
    # this domain; the location block below serves the ACME challenge
    # directly from the webroot so renewal is non-interactive.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

