server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # API — proxy to backend, never cached
    location /api/ {
        proxy_pass http://hexa-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # Content-hashed static assets — safe to cache forever
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML entry pages — always revalidate so the newest hashed bundles load
    location / {
        try_files $uri.html $uri/ $uri =404;
        add_header Cache-Control "no-cache";
    }
}
